paper_title: "The Logistics of Post-Harvest Work: Market Access, Labour Burden and Hired Labour in Nigerian Farm Households"
target_journal: "Journal of Agriculture and Food Research"
status: "private design locked before descriptive and model results"
study_design: "Wave 4 cross-sectional descriptive association study"
analytic_population: "Household-crop records observed in the Wave 4 post-harvest labour modules and linked to a positive contemporaneous cross-sectional household weight and a nonmissing household distance to nearest market."
analytic_unit: "household-crop record"
primary_exposure:
  variable: "dist_market"
  source_definition: "Household distance in kilometres to nearest market"
  primary_transformation: "log(1 + kilometres)"
  descriptive_presentation: "weighted quartiles of raw kilometres"
primary_outcomes:
  - "any paid hired post-harvest labour reported for the household-crop"
  - "total recorded post-harvest worker-hours per household-crop, constructed before task expansion"
secondary_outcome: "paid hired share of recorded worker-hours, reported only after denominator and missingness checks"
claims_supported: "Survey-weighted descriptive patterns and conditional descriptive associations between the registered market-access measure and recorded post-harvest labour outcomes."
claims_not_supported:
  - "causal effect of market access or distance"
  - "transport costs or specific market mechanism"
  - "physical post-harvest loss"
  - "agricultural productivity or household welfare"
  - "individual wages or labour-market equilibrium"
required_sources:
  - "sectaphl1_harvestw4.dta"
  - "sectaphl2_harvestw4.dta"
  - "secta_harvestw4.dta"
  - "NGA_HouseholdGeovars_Y4.dta"
  - "sectc2_harvestw4.dta"
secondary_community_access_measure: "Community report on access to the nearest market, whether it is within the community, and conditional reported distance in kilometres, one-way travel cost, and travel time."
privacy_rule: "No GHS microdata, household identifier, geographic variable, cluster identifier, row-level derivative, model object, or reconstructed output may enter a public repository."
